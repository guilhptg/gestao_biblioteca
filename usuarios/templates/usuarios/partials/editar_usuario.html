<!-- Editar usuario -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Editar Usuário</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 font-sans text-slate-800 min-h-screen">
    
    <nav class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <i data-lucide="user-cog" class="text-blue-600"></i>
                <span class="font-bold text-xl tracking-tight text-slate-900">Gerenciar Conta</span>
            </div>
            <div>
                <a href="{% url 'usuarios:painel_usuarios' %}" class="text-sm font-medium text-gray-500 hover:text-blue-600 flex items-center gap-1 transition-colors">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i> Voltar ao Painel
                </a>
            </div>
        </div>
    </nav>

    <main class="max-w-2xl mx-auto py-12 px-4 sm:px-6">
        <div class="bg-white p-8 rounded-xl shadow-sm border border-gray-200">
            
            <div class="mb-6 border-b border-gray-100 pb-4 flex justify-between items-center">
                <h2 class="text-2xl font-bold flex items-center gap-2">
                    <i data-lucide="edit" class="text-blue-600"></i> Editar Usuário
                </h2>
                <span class="inline-flex items-center gap-1.5 py-1 px-3 rounded-md text-sm font-medium bg-blue-50 text-blue-700 border border-blue-100">
                    <i data-lucide="{% if usuario.tipo_usuario == 'Professor' %}graduation-cap{% else %}user{% endif %}" class="w-4 h-4"></i>
                    Perfil: {{ usuario.tipo_usuario }}
                </span>
            </div>

            <form method="POST" action="{% url 'usuarios:editar_usuario' usuario.id %}" class="space-y-5">
                {% csrf_token %}

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                    <div class="sm:col-span-2">
                        <label class="block text-sm font-medium text-gray-900">Nome Completo</label>
                        <input type="text" name="nome" value="{{ usuario.nome }}" required 
                               class="mt-1 block w-full rounded-md border-0 py-2 px-3 text-gray-900 ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-blue-600 sm:text-sm shadow-sm">
                    </div>
                    
                    <div class="sm:col-span-2">
                        <label class="block text-sm font-medium text-gray-900">E-mail</label>
                        <input type="email" name="email" value="{{ usuario.email }}" required 
                               class="mt-1 block w-full rounded-md border-0 py-2 px-3 text-gray-900 ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-blue-600 sm:text-sm shadow-sm">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 flex items-center gap-1">
                            CPF <i data-lucide="lock" class="w-3 h-3 text-gray-400" title="Campo protegido"></i>
                        </label>
                        <input type="text" value="{{ usuario.cpf }}" disabled 
                               class="mt-1 block w-full rounded-md border-0 py-2 px-3 bg-gray-50 text-gray-500 ring-1 ring-inset ring-gray-200 sm:text-sm cursor-not-allowed">
                        <p class="text-xs text-gray-400 mt-1">O CPF não pode ser alterado.</p>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 flex items-center gap-1">
                            Matrícula <i data-lucide="lock" class="w-3 h-3 text-gray-400" title="Campo protegido"></i>
                        </label>
                        <input type="text" value="{{ usuario.matricula }}" disabled 
                               class="mt-1 block w-full rounded-md border-0 py-2 px-3 bg-gray-50 text-gray-500 ring-1 ring-inset ring-gray-200 sm:text-sm cursor-not-allowed">
                    </div>
                </div>

                <div class="mt-4 pt-4 border-t border-gray-50">
                    {% if usuario.tipo_usuario == 'Aluno' %}
                        <div>
                            <label class="block text-sm font-medium text-gray-900">Curso Vinculado</label>
                            <input type="text" name="curso" value="{{ usuario.curso }}" required 
                                   class="mt-1 block w-full rounded-md border-0 py-2 px-3 text-gray-900 ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-blue-600 sm:text-sm shadow-sm">
                        </div>
                    {% elif usuario.tipo_usuario == 'Professor' %}
                        <div>
                            <label class="block text-sm font-medium text-gray-900">Departamento</label>
                            <input type="text" name="departamento" value="{{ usuario.departamento }}" required 
                                   class="mt-1 block w-full rounded-md border-0 py-2 px-3 text-gray-900 ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-blue-600 sm:text-sm shadow-sm">
                        </div>
                    {% endif %}
                </div>

                <div class="flex items-center gap-2 mt-6 bg-gray-50 p-3 rounded-lg border border-gray-100">
                    <input type="checkbox" name="ativo" id="ativo" {% if usuario.ativo %}checked{% endif %} 
                           class="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-600">
                    <label for="ativo" class="text-sm font-medium text-gray-900 cursor-pointer">
                        Manter Usuário Ativo no Sistema
                    </label>
                </div>

                <div class="mt-8 flex items-center justify-end gap-x-4 border-t border-gray-100 pt-5">
                    <a href="{% url 'usuarios:painel_usuarios' %}" class="text-sm font-semibold text-gray-900 hover:text-gray-600 transition-colors">
                        Cancelar
                    </a>
                    <button type="submit" class="inline-flex items-center gap-2 rounded-md bg-blue-600 px-6 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-blue-500 transition-colors">
                        <i data-lucide="save" class="w-4 h-4"></i> Salvar Alterações
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script>
        // Inicializa os ícones
        lucide.createIcons();
    </script>
</body>
</html>
