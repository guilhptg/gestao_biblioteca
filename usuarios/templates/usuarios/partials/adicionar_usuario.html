<!-- Adcionar novo usuário -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Adicionar Usuário</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 font-sans text-slate-800 min-h-screen">
    
    <main class="max-w-2xl mx-auto py-12 px-4 sm:px-6">
        <div class="bg-white p-8 rounded-xl shadow-sm border border-gray-200">
            <div class="mb-6 border-b border-gray-100 pb-4">
                <h2 class="text-2xl font-bold flex items-center gap-2"><i data-lucide="user-plus" class="text-blue-600"></i> Novo Usuário</h2>
            </div>

            <form method="POST" action="{% url 'usuarios:adicionar_usuario' %}" x-data="{ tipo: 'aluno' }" class="space-y-5">
                {% csrf_token %}
                
                <div>
                    <label class="block text-sm font-medium text-gray-900">Tipo de Usuário</label>
                    <select name="tipo_usuario" x-model="tipo" class="mt-1 block w-full rounded-md border-gray-300 py-2 pl-3 pr-10 text-gray-900 ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-blue-600 sm:text-sm">
                        <option value="aluno">Aluno</option>
                        <option value="professor">Professor</option>
                    </select>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-sm font-medium text-gray-900">Nome Completo</label>
                        <input type="text" name="nome" required class="mt-1 block w-full rounded-md border-0 py-2 px-3 text-gray-900 ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-blue-600 sm:text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-900">CPF</label>
                        <input type="text" name="cpf" required maxlength="11" class="mt-1 block w-full rounded-md border-0 py-2 px-3 text-gray-900 ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-blue-600 sm:text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-900">E-mail</label>
                        <input type="email" name="email" required class="mt-1 block w-full rounded-md border-0 py-2 px-3 text-gray-900 ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-blue-600 sm:text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-900">Matrícula</label>
                        <input type="text" name="matricula" required class="mt-1 block w-full rounded-md border-0 py-2 px-3 text-gray-900 ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-blue-600 sm:text-sm">
                    </div>
                </div>

                <div x-show="tipo === 'aluno'" x-transition>
                    <label class="block text-sm font-medium text-gray-900">Curso (Para Alunos)</label>
                    <input type="text" name="curso" :required="tipo === 'aluno'" class="mt-1 block w-full rounded-md border-0 py-2 px-3 text-gray-900 ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-blue-600 sm:text-sm">
                </div>

                <div x-show="tipo === 'professor'" x-transition x-cloak style="display: none;">
                    <label class="block text-sm font-medium text-gray-900">Departamento (Para Professores)</label>
                    <input type="text" name="departamento" :required="tipo === 'professor'" class="mt-1 block w-full rounded-md border-0 py-2 px-3 text-gray-900 ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-blue-600 sm:text-sm">
                </div>

                <div class="flex items-center gap-2 mt-4">
                    <input type="checkbox" name="ativo" id="ativo" checked class="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-600">
                    <label for="ativo" class="text-sm font-medium text-gray-900">Usuário Ativo no Sistema</label>
                </div>

                <div class="mt-8 flex items-center justify-end gap-x-4 border-t border-gray-100 pt-5">
                    <a href="{% url 'usuarios:painel_usuarios' %}" class="text-sm font-semibold text-gray-900 hover:text-gray-600">Cancelar</a>
                    <button type="submit" class="inline-flex items-center gap-2 rounded-md bg-blue-600 px-6 py-2.5 text-sm font-semibold text-white hover:bg-blue-500"><i data-lucide="save" class="w-4 h-4"></i> Salvar</button>
                </div>
            </form>
        </div>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
