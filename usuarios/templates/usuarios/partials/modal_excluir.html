<!-- Excluir usuario -->
<div x-data="{ open: true }" class="relative z-50">
    <div x-show="open" class="fixed inset-0 bg-gray-900 bg-opacity-75 transition-opacity"></div>
    <div class="fixed inset-0 z-10 w-screen overflow-y-auto">
        <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
            <div x-show="open" @click.away="open = false; setTimeout(() => $el.closest('#modal-container').innerHTML = '', 200)" class="relative transform overflow-hidden rounded-xl bg-white text-left shadow-xl transition-all sm:my-8 sm:w-full sm:max-w-lg">
                <form hx-post="{% url 'usuarios:excluir_usuario' usuario.id %}" hx-target="#modal-container">
                    {% csrf_token %}
                    <div class="bg-white px-4 pb-4 pt-5 sm:p-6 sm:pb-4">
                        <div class="sm:flex sm:items-start">
                            <div class="mx-auto flex h-12 w-12 flex-shrink-0 items-center justify-center rounded-full bg-red-100 sm:mx-0 sm:h-10 sm:w-10">
                                <i data-lucide="alert-triangle" class="h-6 w-6 text-red-600"></i>
                            </div>
                            <div class="mt-3 text-center sm:ml-4 sm:mt-0 sm:text-left">
                                <h3 class="text-lg font-semibold text-gray-900">Desativar Usuário</h3>
                                <p class="text-sm text-gray-500 mt-2">Deseja remover o acesso de <strong>{{ usuario.nome }}</strong>? O histórico de empréstimos será mantido.</p>
                            </div>
                        </div>
                    </div>
                    <div class="bg-gray-50 px-4 py-3 sm:flex sm:flex-row-reverse sm:px-6">
                        <button type="submit" class="inline-flex w-full justify-center rounded-md bg-red-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-red-500 sm:ml-3 sm:w-auto">Desativar</button>
                        <button type="button" @click="open = false; setTimeout(() => $el.closest('#modal-container').innerHTML = '', 200)" class="mt-3 inline-flex w-full justify-center rounded-md bg-white px-3 py-2 text-sm font-semibold text-gray-900 ring-1 ring-inset ring-gray-300 hover:bg-gray-50 sm:mt-0 sm:w-auto">Cancelar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script>
    if (typeof lucide !== 'undefined') { lucide.createIcons(); }
    </script>
</div>
