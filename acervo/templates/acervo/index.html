<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal da Biblioteca</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 font-sans text-slate-800 min-h-screen">

    <nav class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <i data-lucide="library" class="text-blue-600"></i>
                <span class="font-bold text-xl tracking-tight text-slate-900">Biblioteca Acadêmica</span>
            </div>
            <div>
                <a href="/admin" class="text-sm font-medium text-gray-500 hover:text-blue-600 flex items-center gap-1 transition-colors">
                    <i data-lucide="lock" class="w-4 h-4"></i> Acesso Restrito
                </a>
            </div>
            <div>
                <a href="{% url 'usuarios:painel_usuarios' %}" class="text-sm font-medium text-gray-500 hover:text-blue-600 flex items-center gap-1 transition-colors">
                    <i data-lucide="users" class="w-4 h-4"></i> Usuários
                </a>
            </div>

        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="mb-10 text-center">
            <h1 class="text-3xl font-extrabold text-slate-900 sm:text-4xl">Consulta ao Acervo</h1>
            <p class="mt-3 text-lg text-gray-500">Busque por títulos, autores ou ISBN em tempo real.</p>
            
            <div class="mt-6 max-w-xl mx-auto relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <i data-lucide="search" class="text-gray-400 w-5 h-5"></i>
                </div>
                <input type="text" name="q" 
                       placeholder="Digite o nome do livro ou autor..."
                       class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 shadow-sm text-lg"
                       hx-get="{% url 'acervo:buscar_livros' %}" 
                       hx-trigger="keyup changed delay:300ms, search" 
                       hx-target="#grid-resultados" 
                       hx-indicator="#loading">
            </div>
            <div id="loading" class="htmx-indicator mt-4 text-blue-600 hidden">
                <i data-lucide="loader-2" class="animate-spin inline-block"></i> Buscando...
            </div>
        </div>

        <!-- Botão para modal de adiconar novo livro -->
        <div class="mb-6 text-right">
            <a href="{% url 'acervo:adicionar_livro' %}" 
               class="inline-flex items-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
                <i data-lucide="plus" class="w-4 h-4"></i> Adicionar Novo Livro
            </a>
        </div>

        <!-- Grid de resultados -->
        <div id="grid-resultados" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            {% include 'acervo/partials/grid_livros.html' %}
        </div>
    </main>

    <script>
        // Inicializa os ícones Lucide
        lucide.createIcons();
    </script>
</body>
</html>
