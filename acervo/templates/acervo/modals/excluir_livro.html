<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excluir Livro - Biblioteca</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 font-sans text-slate-800 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-xl shadow-lg border border-gray-100 overflow-hidden text-center">
        
        <div class="bg-red-50 p-6 flex justify-center">
            <div class="bg-red-100 p-3 rounded-full">
                <i data-lucide="alert-triangle" class="w-10 h-10 text-red-600"></i>
            </div>
        </div>
        
        <div class="p-6">
            <h3 class="text-xl font-bold text-gray-900 mb-2">Excluir Livro?</h3>
            <p class="text-gray-500 text-sm mb-6">
                Você tem certeza que deseja remover o livro <br>
                <strong class="text-gray-800">"{{ livro.titulo }}"</strong> do acervo? 
                <br><br>
                Esta ação ocultará o livro do catálogo, mas o histórico de empréstimos será mantido no sistema.
            </p>

            <form method="POST" action="{% url 'acervo:excluir_livro' livro.id %}" class="flex gap-3 justify-center">
                {% csrf_token %}
                <a href="{% url 'acervo:catalogo' %}" class="flex-1 inline-flex justify-center items-center px-4 py-2 bg-white border border-gray-300 rounded-md font-semibold text-gray-700 hover:bg-gray-50 transition-colors">
                    Cancelar
                </a>
                <button type="submit" class="flex-1 inline-flex justify-center items-center gap-2 px-4 py-2 bg-red-600 border border-transparent rounded-md font-semibold text-white hover:bg-red-700 transition-colors">
                    <i data-lucide="trash-2" class="w-4 h-4"></i> Sim, Excluir
                </button>
            </form>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
