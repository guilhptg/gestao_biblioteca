<!-- Painel de Emprestimos -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel de Empréstimos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 font-sans text-slate-800 min-h-screen">

    <nav class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <i data-lucide="arrow-right-left" class="text-blue-600"></i>
                <span class="font-bold text-xl tracking-tight text-slate-900">Empréstimos Ativos</span>
            </div>
            <div class="flex gap-4">
                <a href="{% url 'usuarios:painel_usuarios' %}" class="text-sm font-medium text-gray-500 hover:text-blue-600 flex items-center gap-1">
                    <i data-lucide="users" class="w-4 h-4"></i> Usuários
                </a>
                <a href="{% url 'acervo:catalogo' %}" class="text-sm font-medium text-gray-500 hover:text-blue-600 flex items-center gap-1">
                    <i data-lucide="library" class="w-4 h-4"></i> Acervo
                </a>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="mb-8 flex flex-col md:flex-row justify-between items-center gap-4 border-b border-gray-200 pb-5">
            <div class="relative w-full md:w-96">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <i data-lucide="search" class="text-gray-400 w-5 h-5"></i>
                </div>
                <input type="text" name="q" placeholder="Buscar por usuário ou livro..."
                       class="block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 shadow-sm"
                       hx-get="{% url 'operacoes:buscar_emprestimos' %}" 
                       hx-trigger="keyup changed delay:300ms, search" 
                       hx-target="#grid-emprestimos">
            </div>
            
            <a href="{% url 'operacoes:realizar_emprestimo' %}" class="inline-flex items-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors shadow-sm whitespace-nowrap">
                <i data-lucide="plus-circle" class="w-4 h-4"></i> Novo Empréstimo
            </a>
        </div>

        <div id="grid-emprestimos" class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            {% include 'operacoes/partials/grid_emprestimos.html' %}
        </div>
    </main>

    <div id="modal-container"></div>
    <script>lucide.createIcons();</script>
</body>
</html>
